<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Mini Chat</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:Arial;
    background:#343541;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-container{
    width:400px;
    height:650px;
    background:#444654;
    border-radius:15px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.header{
    background:#202123;
    color:white;
    text-align:center;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.subtitle{
    font-size:14px;
    margin-top:5px;
    opacity:0.7;
}

.messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
}

.message{
    max-width:80%;
    padding:12px;
    margin-bottom:15px;
    border-radius:12px;
    line-height:1.5;
    color:white;
    animation: apparition 0.3s ease;
}

.user{
    background:#19c37d;
    align-self:flex-end;
}

.bot{
    background:#2d2f39;
    align-self:flex-start;
}

.input-zone{
    display:flex;
    padding:10px;
    background:#202123;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    margin-left:10px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#19c37d;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#15a76a;
}

small{
    opacity:0.6;
}

@keyframes apparition{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>
<body>
<div class="chat-container">
    <div class="header">
        Mini Chat
        <div class="subtitle">
            Conversation intelligente en JavaScript
        </div>
    </div>
    <div class="messages" id="messages">
    </div>

    <div class="input-zone">

        <input
        type="text"
        id="input"
        placeholder="Écris un message...">

        <button onclick="envoyer()">

            Envoyer

        </button>

    </div>

</div>

ajouterMessage("Salut, je suis prêt à discuter avec toi.", "bot");
<script>
let reponsesGenerales = [
    "Je comprends.",
    "C’est intéressant.",
    "Ah d’accord.",
    "Tu peux m’en dire plus ?",
    "Je vois ce que tu veux dire.",
    "Ça doit être compliqué parfois.",
    "Je pense que beaucoup de personnes ressentent ça.",
    "C’est une bonne question.",
    "Tu sembles y penser sérieusement.",
    "Parfois il faut juste du temps.",
    "Je comprends ton point de vue.",
    "C’est vrai.",
    "Je suis d’accord avec toi.",
    "Ça arrive souvent.",
    "Tu as probablement raison."
];

function envoyer(){

    let input =
    document.getElementById("input");

    let texte =
    input.value.trim();

    if(texte === "") return;

    ajouterMessage(texte, "user");

    input.value = "";

    let typing =
    ajouterMessage("Le bot écrit...", "bot");

    setTimeout(() => {

        typing.remove();

        let reponse =
        genererReponse(texte);

        ajouterMessage(reponse, "bot");

    }, 1000);
}

function ajouterMessage(texte, type){

    let div =
    document.createElement("div");

    div.classList.add("message");

    div.classList.add(type);

    let heure =
    new Date().toLocaleTimeString([], {

        hour:"2-digit",

        minute:"2-digit"
    });

    div.innerHTML = `

        ${texte}

        <br>

        <small>${heure}</small>
    `;

    document
    .getElementById("messages")
    .appendChild(div);

    scrollBas();

    return div;
}

function scrollBas(){

    let messages =
    document.getElementById("messages");

    messages.scrollTop =
    messages.scrollHeight;
}

function choisir(tableau){

    return tableau[
        Math.floor(
            Math.random() * tableau.length
        )
    ];
}

function genererReponse(question){

    question =
    question.toLowerCase();

    // BONJOUR
    if(

        question.includes("bonjour") ||
        question.includes("salut") ||
        question.includes("hello")
    ){

        return choisir([

            "Salut, comment vas-tu ?",
            "Bonjour, ça fait plaisir de parler avec toi.",
            "Hello, quoi de neuf ?"
        ]);
    }

    // CA VA
    else if(

        question.includes("ça va") ||
        question.includes("ca va")
    ){

        return choisir([

            "Oui ça va bien, merci.",
            "Je vais bien aujourd’hui.",
            "Ça va plutôt bien."
        ]);
    }

    // AMOUR
    else if(

        question.includes("amour") ||
        question.includes("copain") ||
        question.includes("relation")
    ){

        return choisir([

            "Les relations peuvent être compliquées parfois.",

            "L’amour demande souvent de la patience.",

            "Quand deux personnes se comprennent, tout devient plus simple."
        ]);
    }

    // TRISTE
    else if(

        question.includes("triste") ||

        question.includes("mal")
    ){

        return choisir([

            "J’espère que ça ira mieux bientôt.",

            "Parler de ce qu’on ressent aide parfois.",

            "Certaines périodes sont difficiles mais elles passent."
        ]);
    }

    // FATIGUE
    else if(

        question.includes("fatigué") ||

        question.includes("fatigue")
    ){

        return choisir([

            "Tu devrais peut-être te reposer un peu.",

            "Le repos est important aussi.",

            "Parfois le corps a juste besoin d’une pause."
        ]);
    }

    // ETUDES
    else if(

        question.includes("étude") ||

        question.includes("ecole") ||

        question.includes("travail")
    ){

        return choisir([

            "Il faut beaucoup de motivation pour continuer.",

            "Le travail finit souvent par payer.",

            "Ce n’est pas toujours facile mais il faut avancer."
        ]);
    }

    // MERCI
    else if(
        question.includes("merci")
    ){

        return choisir([

            "Avec plaisir.",

            "Je t’en prie.",

            "Pas de souci."
        ]);
    }

    // AUREVOIR
    else if(

        question.includes("bye") ||

        question.includes("au revoir")
    ){

        return choisir([

            "À bientôt.",

            "Prends soin de toi.",

            "Bonne journée."
        ]);
    }

    // PAR DEFAUT
    else{

        return choisir(reponsesGenerales);
    }
}

// ENTRÉE
document
.getElementById("input")
.addEventListener("keypress",

function(e){

    if(e.key === "Enter"){

        envoyer();
    }
});

</script>
</body>
</html>
